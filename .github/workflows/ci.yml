name: CI

# Every push and every pull request. Nothing merges without this having run.
on:
  push:
    branches: ['**']
  pull_request:

# One run per ref. A new push supersedes the one in flight — the browser jobs
# here are minutes long and there is no value in finishing a run for a commit
# that has already been replaced. `main` is exempt: a superseded run on the
# default branch would leave a gap in the record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Node 22 is what services/api targets (ARCHITECTURE §8) and what the engines
  # field allows. There is no matrix: this is a browser product with one
  # deployment target, so a second Node version would buy nothing and double
  # the cost of every browser job. The one axis worth a matrix is *device*, and
  # no runner GitHub offers has a GPU or a touchscreen — see the honesty note
  # in tools/perf/report.mjs.
  NODE_VERSION: '22'
  # Playwright is chatty about downloads it is not making.
  PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: '1'

jobs:
  # ---------------------------------------------------------------- verify --
  # Compile, test, build. Everything downstream needs the build, so this gate
  # runs first and the browser jobs wait on it.
  #
  # Local equivalent: npm run ci:local -- --only typecheck,unit,tools,build
  verify:
    name: typecheck · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Caches ~/.npm keyed on package-lock.json.
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        # Also emits packages/*/dist, which the simulation benchmark imports.
        run: npx tsc -b --pretty false

      - name: Unit and integration tests
        run: npm test

      - name: Tests for the measuring instruments
        # An analyser that reports the wrong number is worse than no analyser.
        run: npm run test:tools

      - name: Build
        run: npm run build

      - name: Upload the web build
        # Shared with every browser job below so the build happens once.
        # `apps/console/dist` as well as the player build: the `console` suite
        # previews the operator app on its own origin and talks to the API
        # cross-origin, the way it is actually deployed, so without it that job
        # has nothing to serve.
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            apps/web/dist
            apps/console/dist
            packages/*/dist
          retention-days: 3
          if-no-files-found: error

  # ------------------------------------------------------------ acceptance --
  # "Does the ritual still work?" A failure here means the product is broken.
  #
  # Local equivalent: npm run e2e:acceptance
  acceptance:
    name: acceptance — the ritual runs end to end
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .

      # Cached by Playwright's exact version: a browser download is ~150 MB and
      # the version is pinned by the lockfile, so the key never goes stale
      # silently.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        # On a normal runner Playwright manages its own browser. This
        # environment instead ships a pre-provisioned build and points
        # PLAYWRIGHT_BROWSERS_PATH at it; playwright.config.ts resolves either.
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the acceptance suite
        run: npm run e2e:acceptance

      - name: Upload stage screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-screenshots
          path: artifacts/screenshots
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  # ----------------------------------------------------------- performance --
  # Its own job so a red build says "a performance budget was blown" rather
  # than "e2e failed". ARCHITECTURE §10.
  #
  # Local equivalent: npm run perf
  performance:
    name: performance budgets (ARCHITECTURE §10)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .

      - name: Simulation benchmark
        # The npm script supplies two V8 flags and both matter:
        # --expose-gc forces the major collections the retained-heap checkpoints
        # need, and --max-semi-space-size=64 makes the nursery large enough that
        # no scavenge lands inside an allocation sample window. Without them the
        # benchmark measures V8's collection schedule rather than the model.
        run: npm run perf:sim

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Renderer budget instrumentation
        run: npm run perf:render

      - name: Merged report
        # Always: the report's value is largely in the numbers and in the
        # statement of what a GPU-less runner cannot measure, both of which are
        # more useful on a failure than on a pass. It also prints the two
        # pinned deviations from §10 next to their budgets, so a passing run
        # still shows them.
        if: always()
        run: npm run perf:report

      - name: Summarise into the job page
        if: always()
        run: cat artifacts/perf/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: artifacts/perf
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------- visual --
  # Its own job so a red build says "the picture changed" and hands over the
  # expected/actual/diff triptych.
  #
  # Local equivalent: npm run visual   (update baselines: npm run visual:update)
  visual:
    name: visual regression
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Compare every ritual stage against its baseline
        run: npm run visual

      - name: Upload the diff report
        # The whole point of this job on a failure. `test-results` holds the
        # expected/actual/diff triptych for each mismatched stage.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: |
            playwright-report
            test-results
            artifacts/visual
          retention-days: 14
          if-no-files-found: warn

  # ----------------------------------------------------------------- audio --
  # Renders the synthesised sounds through a real OfflineAudioContext and
  # measures them. Separate job: "the latch stopped being a low-frequency
  # sound" is a different failure from "a texture moved".
  #
  # Local equivalent: npm run audio:analyse
  audio:
    name: audio analysis
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        # WebAudio needs a browser; Node has no AudioContext at all.
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Render and measure every signature sound
        run: npm run audio:analyse

      - name: Summarise into the job page
        if: always()
        run: cat artifacts/audio/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the audio report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-report
          path: artifacts/audio
          retention-days: 30
          if-no-files-found: warn

  # ------------------------------------------------------------- access --
  # "Can a person who cannot use a pointer still do this?" Its own job because
  # it fails on its own thing: not "the ritual stopped working" but "the ritual
  # stopped being reachable". It is also the one suite forbidden from driving
  # the stage under audit through `window.__someMore.actions`, which is exactly
  # why it can see what `acceptance` cannot — see
  # docs/SECURITY_AND_ACCESSIBILITY_AUDIT.md §3.
  #
  # Local equivalent: npm run e2e:access
  access:
    name: accessibility — §12, driven rather than read
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the accessibility suite
        run: npm run e2e:access

      - name: Upload the keyboard-only screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-screenshots
          path: artifacts/screenshots
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  # ------------------------------------------------------------------- all --
  # One required check to protect the branch with, so adding a job later does
  # not mean editing branch-protection settings.
  # ------------------------------------------------------------- the rest --
  # Eight Playwright projects existed, were green, and were run by nobody but
  # whoever happened to remember them. A suite nothing enforces is a suite that
  # is already broken and has not been told yet.
  #
  # A matrix rather than eight hand-written jobs, and `fail-fast: false` so one
  # red project does not hide the state of the other seven. Each still names
  # itself in the job list, which is the whole reason the projects are split by
  # *what they fail on* in the first place: "the campsite is no longer shared"
  # is a different sentence from "the ritual stopped working".
  #
  # Local equivalent: npm run e2e:suite -- <name>
  suites:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project:
          - activities   # you can no longer do anything here except make a s'more
          - night        # the fire went out and you cannot see
          - campfire     # the campsite is no longer shared
          - offline      # the offline claim in the README was never true
          - pwa-update   # an app that cannot be fixed on the devices that have it
          - mobile       # it no longer fits in a hand
          - redeem       # the physical bridge stopped connecting
          - console      # whoever schedules a meteor shower is back on curl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the ${{ matrix.project }} suite
        run: npm run e2e:suite -- ${{ matrix.project }}

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-playwright-report
          path: |
            playwright-report
            test-results
            artifacts/screenshots
          retention-days: 14
          if-no-files-found: ignore

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [verify, acceptance, access, suites, performance, visual, audio]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        run: |
          echo "verify=${{ needs.verify.result }}"
          echo "acceptance=${{ needs.acceptance.result }}"
          echo "access=${{ needs.access.result }}"
          echo "suites=${{ needs.suites.result }}"
          echo "performance=${{ needs.performance.result }}"
          echo "visual=${{ needs.visual.result }}"
          echo "audio=${{ needs.audio.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
